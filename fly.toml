# fly.toml app configuration file generated for burstotp-bot on 2026-10-17T21:27:54Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'burstotp-bot'
primary_region = 'maa'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
